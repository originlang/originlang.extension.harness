name: Release

# 发布唯一入口：push vX.Y.Z 标签（tag 即版本号，不依赖 release-please）。
#   git tag v0.1.1 && git push origin v0.1.1
# 触发后按 tag 检出代码，测试、构建插件产物并挂到同名 GitHub Release。nightly 不走这条线。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      BUILD_TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Install repository toolchain
        run: rustup show active-toolchain
      - name: Run tests
        run: cargo test --locked -p originlang-ext-harness
      - name: Build the plugin
        run: cargo build --locked --release -p originlang-ext-harness-plugin --target $env:BUILD_TARGET
      - name: Package
        run: ./.github/scripts/package.ps1 -Target $env:BUILD_TARGET -Channel stable
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Create release and attach assets
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Create release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          # 矩阵少一个平台时宁可失败，也不要发半套产物
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 2
          sha256sum --check ./*.sha256
          gh release create "$RELEASE_TAG" ./*.zip ./*.tar.gz ./*.sha256 \
            --repo "$GH_REPO" \
            --verify-tag \
            --title "originlang-ext-harness ${RELEASE_TAG#v}" \
            --generate-notes
