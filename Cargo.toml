[workspace]
resolver = "2"
members = ["crates/harness", "crates/plugin"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/originlang/originlang.extension.harness"

[workspace.dependencies]
# 公共依赖
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"

# 宿主边界：只依赖 C ABI 契约 crate，不链接宿主本身。
# 插件被宿主加载，而不是反过来依赖宿主。
originlang-ext-plugin-abi = { path = "../originlang.extension.host/crates/plugin-abi" }

# 仅 CLI（开发与 CI 用）需要直接构造一个宿主实例
originlang-ext-host = { path = "../originlang.extension.host/crates/host" }
originlang-ext-runtime = { path = "../originlang.extension.host/crates/runtime" }
originlang-ext-runtime-process = { path = "../originlang.extension.host/crates/runtime-process" }
originlang-ext-runtime-quickjs = { path = "../originlang.extension.host/crates/runtime-quickjs" }
originlang-ext-runtime-dylib = { path = "../originlang.extension.host/crates/runtime-dylib" }

# 内部 crate
originlang-ext-harness = { path = "crates/harness" }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
