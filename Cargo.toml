[workspace]
resolver = "2"
members = ["crates/harness", "crates/plugin"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/originlang/originlang.extension.harness"

[workspace.dependencies]
# 公共依赖
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"

# 宿主边界：只依赖 C ABI 契约 crate，不链接宿主本身。
# 插件被宿主加载，而不是反过来依赖宿主。
#
# 用 git 而不是 path：本仓库可以单独检出、单独构建，不需要宿主仓库并排放在
# 同级目录。rev 锁定宿主契约的具体提交，宿主升级时改这里再跑
# `cargo update -p originlang-ext-plugin-abi`。
originlang-ext-plugin-abi = { git = "https://github.com/originlang/originlang.extension.host", rev = "a218046" }

# 内部 crate（同仓成员，必须用 path）
originlang-ext-harness = { path = "crates/harness" }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
